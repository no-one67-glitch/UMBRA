
name: Build UMBRA APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'UMBRA-GitHub-descarga.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip UMBRA-GitHub-descarga.zip

      - name: Fix Java Kotlin compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("UMBRA-Android/app/build.gradle")
          s = p.read_text()

          block = """compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }"""

          if re.search(r'compileOptions\s*\{[^}]*\}', s, re.S):
              s = re.sub(
                  r'compileOptions\s*\{[^}]*\}',
                  block, s, count=1, flags=re.S
              )
          else:
              s = s.replace("android {", "android {\n    " + block, 1)

          p.write_text(s)
          print("Java configurado para JVM 17")
          PY
  
      - name: Build APK
        working-directory: UMBRA-Android
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: UMBRA-APK
          path: UMBRA-Android/app/build/outputs/apk/debug/app-debug.apk
