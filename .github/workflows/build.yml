
name: Build UMBRA APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'UMBRA-GitHub-descarga.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip UMBRA-GitHub-descarga.zip

      - name: Build APK
        working-directory: UMBRA-Android
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: UMBRA-APK
          path: UMBRA-Android/app/build/outputs/apk/debug/app-debug.apk
